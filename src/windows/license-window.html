<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none';">
<title>Activate License</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: url('../../assets/fonts/PlusJakartaSans-Variable.ttf') format('truetype');
    font-weight: 200 800;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --text: #f7f7f8;
    --muted: rgba(255,255,255,.62);
    --muted-2: rgba(255,255,255,.32);
    --red: #e8192c;
    --red-hi: #ff3b4d;
    --glass-edge: rgba(255,255,255,.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #08080b;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  /* Soft coloured light behind the glass: the card blurs and refracts these. */
  body {
    position: relative;
    display: flex;
    align-items: safe center;
    justify-content: center;
    overflow-y: auto;
    scrollbar-width: none;
    background:
      radial-gradient(520px 360px at 12% 8%, rgba(232,25,44,.55), transparent 68%),
      radial-gradient(460px 380px at 92% 92%, rgba(255,92,72,.38), transparent 70%),
      radial-gradient(340px 260px at 88% 12%, rgba(255,214,222,.16), transparent 72%),
      #08080b;
  }
  body::-webkit-scrollbar { display: none; }
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(46px);
    pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  body::before { width: 220px; height: 220px; left: -40px; top: 18%; background: rgba(232,25,44,.5); }
  body::after  { width: 200px; height: 200px; right: -30px; bottom: 10%; background: rgba(255,120,96,.36); animation-delay: -6s; }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(26px,-22px,0) scale(1.12); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(364px, calc(100vw - 24px));
    margin: 12px 0;
    padding: 26px 26px 22px;
    border-radius: 30px;
    -webkit-app-region: no-drag;
    background: linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.05) 55%, rgba(255,255,255,.09));
    border: 1px solid var(--glass-edge);
    -webkit-backdrop-filter: blur(34px) saturate(190%);
    backdrop-filter: blur(34px) saturate(190%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -1px 0 rgba(255,255,255,.06),
      inset 0 0 30px rgba(255,255,255,.04),
      0 28px 64px -14px rgba(0,0,0,.65),
      0 0 90px -24px rgba(232,25,44,.45);
  }
  /* specular light across the top edge */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(240px 120px at 18% -6%, rgba(255,255,255,.34), transparent 70%);
  }

  /* Logo */
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .logo {
    width: 60px;
    height: 60px;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 8px 24px rgba(232,25,44,.45));
  }
  .logo img { display: block; width: 60px; height: 60px; border-radius: 15px; }

  .brand {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    text-align: center;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.02em;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 14px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.55;
    text-align: center;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin: 12px 0 6px;
    letter-spacing: .04em;
  }

  input {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
    user-select: text;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  input::placeholder { color: rgba(255,255,255,.3); }
  input:focus {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,59,77,.85);
    box-shadow: 0 0 0 4px rgba(232,25,44,.22), inset 0 1px 0 rgba(255,255,255,.1);
  }
  input.license-input {
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  button.activate {
    width: 100%;
    height: 44px;
    margin-top: 18px;
    background: linear-gradient(180deg, var(--red-hi), var(--red));
    color: #fff;
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 14px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: .02em;
    font-family: inherit;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 12px 28px -8px rgba(232,25,44,.7);
    transition: filter .12s, transform .08s, box-shadow .15s;
  }
  button.activate:hover:not(:disabled) { filter: brightness(1.08); }
  button.activate:active:not(:disabled) { transform: translateY(1px); }
  button.activate:disabled {
    background: rgba(255,255,255,.08);
    color: var(--muted);
    border-color: rgba(255,255,255,.1);
    box-shadow: none;
    cursor: not-allowed;
  }

  .message {
    margin-top: 12px;
    font-size: 12px;
    display: none;
    line-height: 1.5;
    text-align: center;
  }
  .message.error   { display: block; color: #ff9aa5; }
  .message.success { display: block; color: #fff; }

  .footer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,.12);
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }
  .footer a {
    color: var(--red-hi);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255,59,77,.5);
    padding-bottom: 1px;
    cursor: pointer;
  }
  .footer a:hover { border-bottom-color: var(--red-hi); }
  .footer .divider {
    color: var(--muted-2);
    margin: 0 4px;
  }

  /* Buy CTA — glass button */
  .buy-cta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding: 11px 14px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(232,25,44,.28), rgba(232,25,44,.06) 70%);
    border: 1px solid rgba(255,90,104,.42);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 10px 26px -10px rgba(232,25,44,.5);
    transition: background .18s, border-color .18s, transform .08s, box-shadow .18s;
  }
  .buy-cta::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(130px 70px at 10% -10%, rgba(255,255,255,.22), transparent 70%);
    pointer-events: none;
  }
  .buy-cta:hover {
    background: linear-gradient(135deg, rgba(232,25,44,.38), rgba(232,25,44,.1) 70%);
    border-color: rgba(255,110,122,.7);
  }
  .buy-cta:active { transform: translateY(1px); }

  .buy-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.12);
    display: grid;
    place-items: center;
  }
  .buy-icon svg { width: 16px; height: 16px; color: #fff; }

  .buy-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .buy-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .01em;
  }
  .buy-action {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .01em;
  }

  .buy-arrow-wrap {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    display: grid;
    place-items: center;
    transition: background .18s, transform .18s;
  }
  .buy-arrow-wrap svg { width: 13px; height: 13px; color: #fff; transition: color .18s; }
  .buy-cta:hover .buy-arrow-wrap { background: #fff; transform: translateX(2px); }
  .buy-cta:hover .buy-arrow-wrap svg { color: var(--red); }

</style>
</head>
