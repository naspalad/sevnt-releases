<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVNT Design Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0C0D0A;
    --surface: #131510;
    --card: #1C1F18;
    --border: rgba(200,202,190,.1);
    --border2: rgba(200,202,190,.18);
    --accent: #E8192C;
    --accent-dim: rgba(232,25,44,.15);
    --text: #FFFFFF;
    --text-dim: #C8CAB8;
    --muted: #72746A;
    --pill: rgba(255,255,255,.08);
    --pill-active: rgba(232,25,44,.18);
    --phone-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  }
  :root[data-theme="light"] {
    --bg: #EDECE4;
    --surface: #F6F5EE;
    --card: #FFFFFF;
    --border: rgba(20,22,15,.1);
    --border2: rgba(20,22,15,.2);
    --accent-dim: rgba(232,25,44,.1);
    --text: #0E1108;
    --text-dim: #3A3D33;
    --muted: #8A8C80;
    --pill: rgba(20,22,15,.06);
    --pill-active: rgba(232,25,44,.12);
    --phone-shadow: 0 40px 100px rgba(20,22,15,.25), 0 0 0 1px rgba(20,22,15,.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ── Layout ── */
  #app { display: flex; height: 100%; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 24px 16px 20px;
    gap: 6px;
    overflow-y: auto;
  }
  .s-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .s-logo .mark {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .s-logo .mark svg { width: 16px; height: 16px; fill: #fff; }
  .s-logo h1 { font-size: 14px; font-weight: 800; letter-spacing: .04em; color: var(--text); }
  .s-logo p { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }

  .s-label {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    color: var(--muted); text-transform: uppercase;
    padding: 10px 10px 4px;
  }
  .tab-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 10px;
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 13px; font-weight: 500;
    width: 100%; text-align: left;
    transition: background .15s, color .15s;
  }
  .tab-btn:hover { background: var(--pill); color: var(--text); }
  .tab-btn.on { background: var(--pill-active); color: var(--accent); font-weight: 600; }
  .tab-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .tab-btn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: auto; }

  .s-sep { height: 1px; background: var(--border); margin: 8px 0; }

  .s-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .s-btn-sm {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 12px; font-weight: 500;
    width: 100%; text-align: left;
    transition: background .15s, color .15s;
  }
  .s-btn-sm:hover { background: var(--pill); color: var(--text-dim); }
  .s-btn-sm svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Main ── */
  #main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px;
    padding: 32px;
    overflow: hidden;
  }

  /* ── Page label ── */
  .page-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .06em; text-transform: uppercase;
    user-select: none;
  }
  .page-label span {
    padding: 3px 10px; border-radius: 20px;
    background: var(--pill); color: var(--text-dim);
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
  }
  .page-label span.on { background: var(--pill-active); color: var(--accent); }

  /* ── Phone frame ── */
  .phone-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .phone-shell {
    width: 320px;
    background: #1A1A1E;
    border-radius: 44px;
    padding: 14px;
    box-shadow: var(--phone-shadow);
    border: 1px solid rgba(255,255,255,.08);
    position: relative;
  }
  :root[data-theme="light"] .phone-shell {
    background: #2C2C30;
    border-color: rgba(255,255,255,.12);
  }
  /* Notch / Dynamic Island */
  .phone-notch {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 30px;
    background: #0A0A0E; border-radius: 20px;
    z-index: 10;
  }
  /* Screen */
  .phone-screen {
    width: 100%; background: #000;
    border-radius: 32px; overflow: hidden;
    aspect-ratio: 9/19.5;
    position: relative;
  }
  .phone-screen iframe {
    width: 390px; height: 100%;
    border: none;
    transform-origin: top left;
    pointer-events: all;
    display: block;
  }

  /* ── Zoom hint ── */
  .hint {
    font-size: 11px; color: var(--muted);
    text-align: center; line-height: 1.6;
  }
  .hint kbd {
    background: var(--card); border: 1px solid var(--border2);
    padding: 1px 5px; border-radius: 4px;
    font-size: 10px; font-family: monospace;
    color: var(--text-dim);
  }

  /* ── Responsive ── */
  @media (max-width: 700px) {
    #sidebar { display: none; }
    #main { padding: 16px; }
  }
  @media (max-height: 700px) {
    #main { justify-content: flex-start; overflow-y: auto; padding-top: 20px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="s-logo">
      <div class="mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <h1>SEVNT Studio</h1>
        <p>Design Preview</p>
      </div>
    </div>

    <div class="s-label">Halaman</div>

    <button class="tab-btn on" data-page="home" onclick="switchPage(this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Beranda
    </button>
    <button class="tab-btn" data-page="opts" onclick="switchPage(this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M12 2v2M12 20v2M2 12H4M20 12h2M17.66 17.66l-1.41-1.41M6.34 6.34L4.93 4.93"/></svg>
      Opsi Klip
    </button>
    <button class="tab-btn" data-page="frame" onclick="switchPage(this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Crop / Frame
    </button>
    <button class="tab-btn" data-page="mark" onclick="switchPage(this)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h3"/></svg>
      Watermark
    </button>
    <button class="tab-btn" data-page="history" onclick="switchPage(this)">
      <svg viewBox="0 0 24 24"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4"/><polyline points="3 16 3.05 11 8 11"/></svg>
      Riwayat
    </button>

    <div class="s-sep"></div>
    <div class="s-label">Overlay</div>
    <button class="tab-btn" data-page="editor" onclick="openEditor(this)">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editor Klip
    </button>

    <div class="s-bottom">
      <div class="s-sep"></div>
      <button class="s-btn-sm" onclick="toggleTheme()">
        <svg id="theme-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Ganti tema
      </button>
      <button class="s-btn-sm" onclick="reload()">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Reset data dummy
      </button>
      <a class="s-btn-sm" href="companion-ui.html?design=1" target="_blank" style="text-decoration:none">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Buka tab baru
      </a>
    </div>
  </div>

  <!-- Main area -->
  <div id="main">
    <div class="page-label">
      Melihat halaman: <span id="page-name" class="on">Beranda</span>
    </div>

    <div class="phone-wrap">
      <div class="phone-shell">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="phone-screen">
          <iframe id="preview-frame" src="companion-ui.html?design=1&p=home" allow="autoplay" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <p class="hint">Klik tab di kiri untuk pindah halaman &nbsp;·&nbsp; Gulir / klik langsung di dalam layar HP</p>
  </div>
</div>

<script>
  var PAGE_LABELS = { home:'Beranda', opts:'Opsi Klip', frame:'Crop / Frame', mark:'Watermark', history:'Riwayat', editor:'Editor Klip' };
  var _curPage = 'home';

  // Scale iframe to fit the phone screen div
  function scaleFrame() {
    var screen = document.getElementById('phone-screen');
    var frame  = document.getElementById('preview-frame');
    var w = screen.clientWidth;
    var scale = w / 390;
    frame.style.transform = 'scale(' + scale + ')';
    frame.style.width = '390px';
    frame.style.height = (screen.clientHeight / scale) + 'px';
  }
  window.addEventListener('resize', scaleFrame);
  scaleFrame();

  function switchPage(btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    var page = btn.getAttribute('data-page');
    _curPage = page;
    document.getElementById('page-name').textContent = PAGE_LABELS[page] || page;
    // Try to tell the iframe to switch page
    var frame = document.getElementById('preview-frame');
    try {
      if (frame.contentWindow && frame.contentWindow.gotoPage) {
        frame.contentWindow.gotoPage(page);
      } else {
        // reload with page param
        frame.src = 'companion-ui.html?design=1&p=' + page;
      }
    } catch(e) {
      frame.src = 'companion-ui.html?design=1&p=' + page;
    }
  }

  function openEditor(btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    document.getElementById('page-name').textContent = 'Editor Klip';
    var frame = document.getElementById('preview-frame');
    try {
      if (frame.contentWindow && frame.contentWindow.openEditor) {
        frame.contentWindow.openEditor({ id:'c1', title:'Demo Klip 1', ready:true, media:'c1', dur:45 }, false);
      } else {
        frame.src = 'companion-ui.html?design=1&p=home';
      }
    } catch(e) {
      frame.src = 'companion-ui.html?design=1&p=home';
    }
  }

  function toggleTheme() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    // sync iframe
    var frame = document.getElementById('preview-frame');
    try {
      if (frame.contentWindow && frame.contentWindow.document) {
        frame.contentWindow.document.documentElement.setAttribute('data-theme', next);
        try { frame.contentWindow.localStorage.setItem('sevnt_theme', next); } catch(e){}
      }
    } catch(e) {}
    // update icon
    var ico = document.getElementById('theme-ico');
    if (next === 'light') {
      ico.innerHTML = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    } else {
      ico.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
  }

  function reload() {
    var frame = document.getElementById('preview-frame');
    frame.src = 'companion-ui.html?design=1&p=' + _curPage;
  }

  // Re-scale when iframe loads
  document.getElementById('preview-frame').addEventListener('load', scaleFrame);
</script>
</body>
</html>
