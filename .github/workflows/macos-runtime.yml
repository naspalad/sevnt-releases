name: Build SEVNT macOS

on:
  workflow_dispatch:
  push:
    branches: [main, qa/macos-runtime-smoke-no-activation, qa/macos-functional-suite-v2]
    paths:
      - "engine/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "electron-builder.yml"
      - ".github/workflows/macos-runtime.yml"
      - "sevnt-main.js"

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install standalone Python
        run: |
          uv python install 3.11
          PY_EXE="$(uv python find --managed-python 3.11)"
          PY_HOME="$("$PY_EXE" -c 'import sys; print(sys.prefix)')"
          OUT="build/engine-runtime/darwin-${{ matrix.arch }}"

          echo "Python: $PY_EXE"
          echo "Prefix: $PY_HOME"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -a "$PY_HOME/." "$OUT/"

          if [ ! -x "$OUT/bin/python3" ]; then
            PY_BIN="$(find "$OUT/bin" -maxdepth 1 -type f -name 'python3.*' | head -n 1)"
            test -n "$PY_BIN"
            ln -s "$(basename "$PY_BIN")" "$OUT/bin/python3"
          fi

          "$OUT/bin/python3" --version

      - name: Install engine dependencies
        run: |
          OUT="build/engine-runtime/darwin-${{ matrix.arch }}"
          "$OUT/bin/python3" -c 'import pathlib,sysconfig; (pathlib.Path(sysconfig.get_path("stdlib"))/"EXTERNALLY-MANAGED").unlink(missing_ok=True)'
          uv pip install --python "$OUT/bin/python3" -r engine/requirements.upstream.txt

      - name: Runtime self-check
        run: |
          OUT="build/engine-runtime/darwin-${{ matrix.arch }}"
          "$OUT/bin/python3" -I -c "import sys,fastapi,uvicorn,pydantic,faster_whisper,ctranslate2,av,numpy,onnxruntime,tokenizers,huggingface_hub,yt_dlp; print('Runtime OK:', sys.version); print('Architecture:', __import__('platform').machine())"

          "$OUT/bin/python3" -m pip freeze > "$OUT/packages.txt" 2>/dev/null || true
          shasum -a 256 "$OUT/bin/python3" > "$OUT/python-sha256.txt"

          "$OUT/bin/python3" -c "import json,platform,sys; json.dump({'platform':sys.platform,'arch':platform.machine(),'python':sys.version.split()[0]},open('$OUT/runtime-manifest.json','w'),indent=2)"

      - name: Install Node dependencies
        run: npm ci

      - name: Install system FFmpeg for QA
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          FFMPEG_BIN="$(command -v ffmpeg)"
          FFPROBE_BIN="$(command -v ffprobe)"
          test -x "$FFMPEG_BIN"
          test -x "$FFPROBE_BIN"
          "$FFMPEG_BIN" -version | head -n 1
          "$FFPROBE_BIN" -version | head -n 1
          echo "SEVNT_QA_FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "SEVNT_QA_FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"

      - name: Build SEVNT macOS app
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run build:mac:arm64
          else
            npm run build:mac:x64
          fi

      - name: Validate existing QA video fixture (do not overwrite)
        run: |
          FIXTURE="tests/fixtures/qa-source.mp4"
          test -s "$FIXTURE" || { echo "Missing prepared QA video fixture: $FIXTURE"; exit 1; }
          "$SEVNT_QA_FFPROBE_BIN" -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FIXTURE" > /tmp/sevnt-qa-duration.txt
          DURATION="$(cat /tmp/sevnt-qa-duration.txt)"
          node -e "const fs=require('fs'); const p='tests/fixtures/qa-source.mp4'; const s=fs.statSync(p); const d=Number(fs.readFileSync('/tmp/sevnt-qa-duration.txt','utf8').trim()); if(s.size<10000) throw Error('Prepared QA video is unexpectedly small'); if(!Number.isFinite(d)||d<=0) throw Error('Prepared QA video duration is invalid'); console.log('Using prepared QA fixture:',p,s.size,'bytes;',d,'seconds');"

      - name: Verify navigation contract
        id: navigation_contract
        continue-on-error: true
        run: node --test tests/mac-navigation-contract.test.js

      - name: Test isolated SEVNT dashboard runtime
        id: runtime_ui
        continue-on-error: true
        run: npx playwright test tests/mac-runtime-ui.spec.js --workers=1

      - name: Test SEVNT menu interactions
        id: menu_interactions
        continue-on-error: true
        run: npx playwright test tests/mac-menu-interactions.spec.js --workers=1

      - name: Test watermark state and override contracts
        id: watermark_contract
        continue-on-error: true
        run: node --test tests/mac-watermark-contract.test.js

      - name: Test native FFmpeg render output
        id: ffmpeg_runtime
        continue-on-error: true
        run: npx playwright test tests/mac-ffmpeg-runtime.spec.js --workers=1

      - name: Test bundled Python engine runtime
        id: python_runtime
        continue-on-error: true
        env:
          SEVNT_QA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: node --test tests/mac-engine-runtime.test.js

      - name: Test packaged macOS app startup
        id: packaged_startup
        continue-on-error: true
        env:
          SEVNT_QA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: npx playwright test tests/mac-test.spec.js --workers=1

      - name: Aggregate independent test results
        if: always()
        env:
          NAVIGATION_CONTRACT: ${{ steps.navigation_contract.outcome }}
          RUNTIME_UI: ${{ steps.runtime_ui.outcome }}
          MENU_INTERACTIONS: ${{ steps.menu_interactions.outcome }}
          WATERMARK_CONTRACT: ${{ steps.watermark_contract.outcome }}
          FFMPEG_RUNTIME: ${{ steps.ffmpeg_runtime.outcome }}
          PYTHON_RUNTIME: ${{ steps.python_runtime.outcome }}
          PACKAGED_STARTUP: ${{ steps.packaged_startup.outcome }}
        run: |
          failed=0
          for value in \
            "${NAVIGATION_CONTRACT}" \
            "${RUNTIME_UI}" \
            "${MENU_INTERACTIONS}" \
            "${WATERMARK_CONTRACT}" \
            "${FFMPEG_RUNTIME}" \
            "${PYTHON_RUNTIME}" \
            "${PACKAGED_STARTUP}"; do
            echo "$value"
            if [ "$value" != "success" ]; then failed=1; fi
          done
          exit "$failed"

      - name: Collect SEVNT Startup Trace
        if: always()
        shell: bash
        run: |
          TRACE_DIR="$(node -p "require('os').tmpdir()")"
          TRACE_FILE="$TRACE_DIR/sevnt-startup-trace.log"
          OUTPUT="sevnt-startup-trace-${{ matrix.arch }}.log"

          echo "Architecture: ${{ matrix.arch }}"
          echo "Trace directory: $TRACE_DIR"

          if [ -f "$TRACE_FILE" ]; then
            cp "$TRACE_FILE" "$OUTPUT"
            echo "STARTUP TRACE FOUND"
            cat "$OUTPUT"
          else
            echo "STARTUP TRACE NOT FOUND" | tee "$OUTPUT"
            echo "Expected path: $TRACE_FILE" | tee -a "$OUTPUT"
          fi

      - name: Upload SEVNT Startup Trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEVNT-Startup-Trace-${{ matrix.arch }}
          path: sevnt-startup-trace-${{ matrix.arch }}.log
          if-no-files-found: error

      - name: Upload macOS Test Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEVNT-macOS-Test-${{ matrix.arch }}
          path: |
            hasil-test-macos-*.png
            test-results/

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: SEVNT-macOS-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
