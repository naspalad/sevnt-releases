name: SEVNT Full Menu + Production Integration QA

on:
  workflow_dispatch:
  push:
    branches:
      - qa/full-menu-coverage-design
    paths:
      - "sevnt-main.js"
      - "src/**"
      - "engine/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-integration-qa.yml"

permissions:
  contents: read

jobs:
  production-qa:
    name: Production integration QA (macOS ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ARM64 Apple Silicon
            runner: macos-15
            expected_arch: arm64
          - platform: Intel x64
            runner: macos-15-intel
            expected_arch: x64
    env:
      CI: "1"
      SEVNT_QA_EXPECTED_ARCH: ${{ matrix.expected_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report runner versions
        run: |
          node --version
          python --version
          uname -m

      - name: Verify runner and Electron target architecture
        run: |
          echo "Runner architecture: $(uname -m)"
          echo "Expected architecture: $SEVNT_QA_EXPECTED_ARCH"
          case "$SEVNT_QA_EXPECTED_ARCH:$(uname -m)" in
            arm64:arm64|x64:x86_64) ;;
            *) echo "Unexpected macOS runner architecture"; exit 1 ;;
          esac
          node -p "'Node architecture: ' + process.arch"

      - name: Install Node dependencies
        run: npm ci

      - name: Verify bundled FFmpeg/FFprobe resolve
        # Every QA test file already falls back to these npm-installed binaries
        # when SEVNT_QA_FFMPEG_BIN/SEVNT_QA_FFPROBE_BIN are unset — the same
        # pair production ships to users (see src/sevnt-engine.js). No Homebrew
        # ffmpeg needed: on Intel, `brew install ffmpeg` now compiles from
        # source (Homebrew dropped Intel bottles) and blew through this job's
        # 60-minute timeout on every run.
        run: |
          node -e "const p=require('ffmpeg-static'); require('node:fs').accessSync(p, require('node:fs').constants.X_OK); console.log('ffmpeg-static:', p)"
          node -e "const p=require('@ffprobe-installer/ffprobe').path; require('node:fs').accessSync(p, require('node:fs').constants.X_OK); console.log('ffprobe-installer:', p)"

      - name: Validate full-menu QA plan
        run: npm run test:qa:plan

      - name: Run all 88 menu scenarios (Clips, Clip, Editor, Watermark, Crop, Split, History, Settings, Output, Help)
        run: npm run test:qa:menu-coverage

      - name: Install Python engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.upstream.txt
          python -c "import fastapi,uvicorn,pydantic,faster_whisper; print('Python engine dependencies OK')"

      - name: Run production IPC against real Electron Main and Preload
        run: npm run test:qa:production-ipc

      - name: Run production FFmpeg, FFprobe and Python Engine integration
        run: |
          echo "SEVNT_ENGINE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          npm run test:qa:production-media

      - name: Run persistence across full Electron restart
        run: npm run test:qa:production-persistence

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEVNT-Production-Integration-QA-${{ matrix.expected_arch }}
          path: |
            test-results/
            /tmp/sevnt-production-*
          if-no-files-found: warn
          retention-days: 14
