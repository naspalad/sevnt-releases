name: SEVNT Full Menu + Production Integration QA

on:
  workflow_dispatch:
  push:
    branches:
      - qa/full-menu-coverage-design
    paths:
      - "sevnt-main.js"
      - "src/**"
      - "engine/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/production-integration-qa.yml"

permissions:
  contents: read

jobs:
  production-qa:
    name: Production integration QA (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      SEVNT_QA_EXPECTED_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgtk-3-0 libnss3 libasound2t64 libxss1 libxtst6 libgbm1 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm-dev
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Node dependencies
        run: npm ci

      - name: Validate full-menu QA plan
        run: npm run test:qa:plan

      - name: Run all 88 menu scenarios (Clips, Clip, Editor, Watermark, Crop, Split, History, Settings, Output, Help)
        run: xvfb-run -a npm run test:qa:menu-coverage

      - name: Install Python engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.upstream.txt
          python --version
          python -c "import fastapi,uvicorn,pydantic,faster_whisper; print('Python engine dependencies OK')"

      - name: Run production IPC against real Electron Main and Preload
        run: xvfb-run -a npm run test:qa:production-ipc

      - name: Run production FFmpeg, FFprobe and Python Engine integration
        env:
          SEVNT_ENGINE_PYTHON: ${{ runner.tool_cache }}/Python/3.11.*/x64/bin/python
          SEVNT_QA_FFMPEG_BIN: /usr/bin/ffmpeg
          SEVNT_QA_FFPROBE_BIN: /usr/bin/ffprobe
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          echo "SEVNT_ENGINE_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"
          echo "SEVNT_QA_FFMPEG_BIN=/usr/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "SEVNT_QA_FFPROBE_BIN=/usr/bin/ffprobe" >> "$GITHUB_ENV"
          npm run test:qa:production-media

      - name: Run persistence across full Electron restart
        run: xvfb-run -a npm run test:qa:production-persistence

      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEVNT-Production-Integration-QA
          path: |
            test-results/
            /tmp/sevnt-production-*
          if-no-files-found: warn
          retention-days: 14
